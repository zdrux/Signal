apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal
  labels:
    app: signal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: signal
  template:
    metadata:
      labels:
        app: signal
    spec:
      containers:
        - name: signal
          image: image-registry.openshift-image-registry.svc:5000/signal/signal:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: signal-config
            - secretRef:
                name: signal-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: signal-data
